spring.application.name=Hirers

# Logging configuration
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
logging.level.com.bengj.hirers=${LOG_LEVEL:INFO}
logging.group.hirers_error=com.bengj.hirers.security,com.bengj.hirers.contact
logging.level.hirers_error=${LOG_LEVEL_ERROR:ERROR}

# MySQL-based configuration
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:hirers}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Cache configuration
cache.jobs.ttl-minutes=10
cache.jobs.max-size=5000
cache.companies.ttl-minutes=10
cache.companies.max-size=500
cache.roles.ttl-days=1
cache.roles.max-size=100

# CORS configuration
app.cors.allowed-origins=http://localhost:5173,https://hirers.bengregoryjohn.in
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Actuator configuration
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/hirers/actuator
management.endpoints.web.exposure.include=*

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Job Portal Application
info.app.version=1.0.0
info.app.contact.email=gjdevelopment1015@gmail.com
info.developer.name=Ben Gregory John
info.developer.email=bengj1015@gmail.com

# JavaMailSender Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:gjdevelopment1015@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xhczfxauasitowbu}
spring.mail.properties.mail.smtp.auth=true

# Protocol configuration
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000