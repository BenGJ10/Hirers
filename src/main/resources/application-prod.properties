spring.application.name=Hirers

# =========================
# Database
# =========================
spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT:3306}/${DATABASE_NAME:hirers}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT
# =========================
JWT_SECRET_KEY=${JWT_SECRET_KEY}

# =========================
# Logging
# =========================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.bengj.hirers=${LOG_LEVEL:INFO}


# =========================
# CORS
# =========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://hirers.bengregoryjohn.in}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600


# =========================
# Actuator
# =========================
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/hirers/actuator
management.endpoints.web.exposure.include=health,info

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Job Portal Application
info.app.version=1.0.0


# =========================
# Mail
# =========================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


# =========================
# AWS S3
# =========================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:hirers-data-storage}
aws.region=${AWS_REGION:ap-south-1}


# =========================
# Google OAuth2
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# =========================
# GitHub OAuth2
# =========================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# =========================
# OAuth2 Frontend Redirect
# =========================
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:https://hirers.bengregoryjohn.in/oauth2/callback}